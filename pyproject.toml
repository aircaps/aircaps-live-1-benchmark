[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aircaps-benchmarks"
version = "0.1.0"
description = "Reproducible streaming ASR and turn-taking evaluations"
requires-python = ">=3.12,<3.13"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
dependencies = [
 "aiohttp==3.14.4", "websockets==15.0.1", "numpy==2.4.6", "pandas>=2.2",
 "pyarrow==26.0.1", "scipy==1.17.1", "soundfile==0.13.1", "jiwer==4.0.0",
 "whisper-normalizer==0.1.12", "huggingface-hub==2.4.0",
 "pydantic==2.13.4", "scikit-learn>=1.5", "python-dotenv==1.2.2", "webrtcvad-wheels>=2.0.14"
]

[project.scripts]
aircaps-bench = "aircaps_benchmarks.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/aircaps_benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
